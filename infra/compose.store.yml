services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tesoob_store
      POSTGRES_USER: tesoob
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD}
    volumes:
      - store-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tesoob -d tesoob_store"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
  backend:
    build: ../backend
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/tesoob_store
      DB_USER: tesoob
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD}
      STORE_AES_KEY: ${STORE_AES_KEY:?Defina uma chave AES-256 em Base64}
      STORE_ADMIN_EMAIL: ${STORE_ADMIN_EMAIL:-}
      STORE_ADMIN_PASSWORD_HASH: ${STORE_ADMIN_PASSWORD_HASH:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
volumes:
  store-data:
