server:
  port: 8080
  servlet:
    context-path: /store-api
    session:
      timeout: 30m
      cookie:
        name: TESOOB_STORE_SESSION
        path: /store-api
        http-only: true
        secure: ${COOKIE_SECURE:true}
        same-site: lax
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tesoob_store}
    username: ${DB_USER:tesoob}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  mvc:
    log-request-details: false
store:
  crypto:
    active-key: ${STORE_ACTIVE_KEY:v1}
    keys:
      v1: ${STORE_AES_KEY}
  bootstrap:
    email: ${STORE_ADMIN_EMAIL:}
    password-hash: ${STORE_ADMIN_PASSWORD_HASH:}
logging:
  level:
    org.hibernate.orm.jdbc.bind: OFF
    org.springframework.security: WARN
    org.springframework.web: WARN
---
spring:
  config:
    activate:
      on-profile: google
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid,email,profile
            redirect-uri: ${GOOGLE_REDIRECT_URI}
